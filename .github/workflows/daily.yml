name: Daily catalog

on:
  schedule:
    - cron: "15 9 * * *"   # 5:15 AM EDT / 4:15 AM EST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Catalog/catalog.source.json", "scripts/**", ".github/workflows/daily.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the ingester
        run: python scripts/test_ingest.py
      - name: Fetch yesterday's snapshot (used only if a source is down)
        run: |
          mkdir -p Catalog/dist
          curl -fsSL "https://snoweyking1.github.io/city-passport-catalog/catalog.json" -o Catalog/dist/catalog.json || rm -f Catalog/dist/catalog.json
      - name: Build and validate today's catalog
        run: python scripts/ingest_daily.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Catalog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
